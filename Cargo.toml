[package]
name = "cellaria"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cellaria"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "warn"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "1.0.69"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cellaria_bench"
harness = false