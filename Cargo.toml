[profile.dev]
debug = false

[package]
name = "cellaria"
version = "0.7.0"
edition = "2021"
autobenches = false

[[bin]]
name = "cellaria"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "warn"

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "1.0.69"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12.0"
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["plotters"] }
proptest = "1"

[[bench]]
name = "cellaria_bench"
harness = false

[[example]]
name = "flagship_shifts"
required-features = ["gpu"]

[[test]]
name = "gpu_v1_correctness"
required-features = ["gpu"]

[[test]]
name = "gpu_v2_correctness"
required-features = ["gpu"]
