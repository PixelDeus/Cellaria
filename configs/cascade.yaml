# Каскад: два правила, где результат первого активирует второе.
#
# Демонстрирует каскадное применение:
#   Шаг 1: [1, 2] → [3, 4] + East shift(1)
#   Шаг 2: [3, 4] → [5, 6] (без сдвига)

grid:
  width: 4
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 1
    - coord: [1, 0]
      type: 2

  boundaries: []

rules:
  - id: [1, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 3}
      - {dx: 1, dy: 0, value: 4}

  - id: [3, 4]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 5}
      - {dx: 1, dy: 0, value: 6}
