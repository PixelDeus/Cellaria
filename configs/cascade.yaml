# Каскад: два правила, где результат первого активирует второе.
#
# Демонстрирует режим "chain_length == pattern_len":
#   - цепочка сдвига ровно покрывает ячейки паттерна (окно = штамп),
#   - нет "вытекания" за пределы group_cells, только сдвиг внутри.
#
# Грамматика конфига:
#   chain_length = 2, pattern_len = 2 (offset[0,0] + offset[1,0])
#   → chain_length == pattern_len: сдвиг не выходит за group_cells.
#
# Шаг 1: [1, 2] → [3, 4] + East shift(2)
#   (0,0) ← fill=0, (1,0) ← old(0,0)=1  →  [0, 1]
#   затем group_cells перезаписываются result: [3, 4]
# Шаг 2: [3, 4] → [5, 6] (без сдвига)

grid:
  width: 4
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 1
    - coord: [1, 0]
      type: 2

  boundaries: []

rules:
  - id: 1
    priority: 10
    pattern:
      - offset: [0, 0]
        type: 1
      - offset: [1, 0]
        type: 2
    result: [3, 4]

  - id: 2
    priority: 10
    pattern:
      - offset: [0, 0]
        type: 3
      - offset: [1, 0]
        type: 4
    result: [5, 6]