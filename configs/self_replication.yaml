# =============================================================================
# Репликатор: маркер идёт вправо, оставляя за собой копии
#
# Механика:
#   [10, 0] → сдвиг east(1), пишет 10 на исходной позиции и на новой.
#   Цепочка 10 10 10 ... растёт слева направо.
#   На границе overflow: discard обрывает цепочку.
#
# Начало: 10 на позиции 0, остальные 0.
# Результат: 10 10 10 ... до границы (16 ячеек).
# =============================================================================

grid:
  width: 16
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10       # маркер-репликатор

  boundaries: []

rules:
  # Репликация: [10, 0] → сдвиг вправо, копия позади + маркер на новой позиции
  - id: [10, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 10}   # исходная позиция → копия маркера
      - {dx: 0, dy: 0, value: 10}    # новая позиция → маркер
