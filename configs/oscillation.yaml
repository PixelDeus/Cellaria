# =============================================================================
# Контрпример: счётчиковый потенциал — не необходимое условие завершимости
#
# Схема:
#   - Маркер (типы 1↔2) осциллирует между позициями 0 и 1.
#   - Таймер (тип 99) на позиции 5, сдвигается west на 1 шаг за тик.
#   - Таймер имеет min_age=10 (сработает через 10 тиков после создания).
#   - Маркер начинает с age=0. Каждый тик возраст маркера растёт.
#   - На тике 0..4: маркер осциллирует 1↔2 между (0,0) и (1,0), Φ_cnt=2.
#   - На тике 10: таймер достигает возраста 10, правило с min_age=10
#     срабатывает, таймер сдвигается west, удаляет маркер.
#   - На тиках 5..9: таймер неподвижен (ждёт age≥10), маркер продолжает
#     осциллировать. Φ_cnt=2 на тиках 0..9, затем падает.
#   - На тике 10: таймер сдвигается на (4,0).
#   - На тике 11: таймер на (3,0)... и так далее до выхода за границу.
#   - Симуляция завершается, когда таймер уходит за левую границу.
#
# Φ_cnt (количество активных ячеек):
#   - Тики 0-9:  Φ_cnt = 2 (таймер 99 + маркер 1/2) — строго не убывает.
#   - Тик 10:    Φ_cnt = 1 (таймер 99 на 4, маркер затирается).
#   - Тики 11-14: Φ_cnt = 1 (таймер 99 движется к границе).
#   - Тик 15:    Φ_cnt = 0.
#
# Вывод: Φ_cnt не монотонен (константа 10 тиков!), но симуляция завершается.
# Счётчиковый потенциал — достаточное, но не необходимое условие.
# =============================================================================

grid:
  width: 6
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [5, 0]
      type: 99      # таймер — далеко от маркера, будет ждать age≥10
    - coord: [0, 0]
      type: 1       # маркер стартует как тип 1

  boundaries: []

rules:
  # ==========================================================================
  # Правило 1: маркер типа 1 → сдвиг east, становится типом 2
  # ==========================================================================
  - id: [1]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 2}

  # ==========================================================================
  # Правило 2: маркер типа 2 → сдвиг west, становится типом 1
  # ==========================================================================
  - id: [2]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 1}

  # ==========================================================================
  # Правило 3: таймер 99 → сдвиг west, min_age=10
  #   Срабатывает только когда возраст ячейки ≥ 10.
  #   Удаляет маркер за счёт приоритета (20 > 10) в конфликте.
  # ==========================================================================
  - id: [99]
    priority: 20
    min_age: 10
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 99}