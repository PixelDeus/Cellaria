# =============================================================================
# Контрпример: счётчиковый потенциал — не необходимое условие завершимости
#
# Схема:
#   - Маркер (типы 1↔2) осциллирует между позициями 0 и 1.
#   - Таймер (тип 99) на позиции 5, сдвигается west на 1 шаг за тик.
#   - Таймер имеет приоритет 20, маркер — 10.
#   - На тике 4 таймер достигает позиции 1, маркер на позиции 0.
#     Таймер сдвигается с 1 на 0, маркер с 0 на 1 — конфликт.
#     Таймер выигрывает, маркер затирается.
#   - На тике 5 таймер на позиции 0, сдвигается west за границу.
#   - Никаких совпадений на тике 6 → завершение.
#
# Φ_cnt (количество активных ячеек):
#   - Тики 0-4: Φ_cnt = 2 (таймер 99 + маркер 1/2) — строго не убывает.
#   - Тик 5:    Φ_cnt = 1 (таймер на 0, перед выходом).
#   - Тик 6:    Φ_cnt = 0.
#
# Вывод: Φ_cnt не монотонен (константа 5 тиков!), но симуляция завершается.
# Счётчиковый потенциал — достаточное, но не необходимое условие.
# =============================================================================

grid:
  width: 6
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [5, 0]
      type: 99      # таймер — далеко от маркера
    - coord: [0, 0]
      type: 1       # маркер стартует как тип 1

  boundaries: []

rules:
  # ==========================================================================
  # Правило 1: маркер типа 1 → сдвиг east, становится типом 2
  # ==========================================================================
  - id: [1]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [0, 0, 2]

  # ==========================================================================
  # Правило 2: маркер типа 2 → сдвиг west, становится типом 1
  # ==========================================================================
  - id: [2]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - [0, 0, 1]

  # ==========================================================================
  # Правило 3: таймер 99 → сдвиг west каждый тик
  # ==========================================================================
  - id: [99]
    priority: 20
    min_age: 0
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - [0, 0, 99]
