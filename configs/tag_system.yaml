# Tag system (Minsky, m=2) в Cellaria — один шаг.
# Второй независимый путь доказательства тьюринг-полноты.
#
# Алфавит: {A=1, B=2}
# Продукции: A→AB (1→[1,2]), B→A (2→[1])
#
# Один шаг tag system:
#   Читаем первый символ, удаляем m=2 символов, дописываем продукцию.
#   Маркер исчезает после записи — никакого возврата.
#
# Демо: A B B → B A B
#   [10, 1, 2, 2] → [0, 11, 2, 2] → [0, 0, 13, 2] → [0, 0, 2, 13]
#   → [0, 0, 2, 1, 15] → [0, 0, 2, 1, 2] → стабильно
#   Результат: B A B (ведущие нули)

grid:
  width: 32
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10      # маркер начала
    - coord: [1, 0]
      type: 1       # A
    - coord: [2, 0]
      type: 2       # B
    - coord: [3, 0]
      type: 2       # B

  boundaries: []

rules:
  # ==========================================================================
  # ФАЗА 1: Чтение первого символа (удаление первого из m=2)
  # [10, X] → [0, 11|12]
  # ==========================================================================
  - id: [10, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 11}

  - id: [10, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 12}

  # ==========================================================================
  # ФАЗА 2: Удаление второго символа (m=2 завершено)
  # [11|12, X] → [0, 13|14]
  # ==========================================================================
  - id: [11, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 13}

  - id: [11, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 13}

  - id: [12, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 14}

  - id: [12, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 0}
      - {dx: 0, dy: 0, value: 14}

  # ==========================================================================
  # ФАЗА 3: Traverse — перенос символов налево
  # [13|14, X] → [X, 13|14]
  # ==========================================================================
  - id: [13, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 1}
      - {dx: 0, dy: 0, value: 13}

  - id: [13, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 2}
      - {dx: 0, dy: 0, value: 13}

  - id: [14, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 1}
      - {dx: 0, dy: 0, value: 14}

  - id: [14, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 2}
      - {dx: 0, dy: 0, value: 14}

  # ==========================================================================
  # ФАЗА 4: Конец строки — запись продукции, маркер исчезает
  # 13+0 → A → B → стоп (A→AB)
  # 14+0 → A → стоп (B→A)
  # ==========================================================================
  # A→AB: пишем A, переходим в 15
  - id: [13, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 1}
      - {dx: 0, dy: 0, value: 15}

  # A→AB: пишем B, маркер 15 → 0 (исчезает). Сдвиг east, чтобы не перезаписать A.
  - id: [15, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 2}
      - {dx: 0, dy: 0, value: 0}

  # B→A: пишем A, маркер 14 → 0 (исчезает). Сдвиг east, чтобы освободить место.
  - id: [14, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: -1, dy: 0, value: 1}
      - {dx: 0, dy: 0, value: 0}
