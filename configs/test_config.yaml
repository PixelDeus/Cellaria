# Тестовый конфиг для модульных тестов (test_load_test_config в config.rs).
#
# НЕ ПРЕДНАЗНАЧЕН для запуска симуляции — используется только
# для проверки парсинга YAML, построения индекса и граничных буферов.
#
# Содержит:
#   - Grid 8×8 с 4 начальными ячейками
#   - 3 правила с разными приоритетами
#   - 2 граничных канала (input channel 0, output channel 1)

grid:
  width: 8
  height: 8
  default_cell_type: 0
  initial_cells:
    - coord: [1, 1]
      type: 1
    - coord: [2, 1]
      type: 2
    - coord: [5, 3]
      type: 1
    - coord: [6, 3]
      type: 2
  boundaries:
    - cell: [0, 0]
      channel: 0
      direction: input
      max_queue: 16
    - cell: [7, 7]
      channel: 1
      direction: output
      max_queue: 16

rules:
  - id: [1]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 3}

  - id: [3]
    priority: 5
    shifts:
      - group:
          - direction: east
            steps: 2
    changes:
      - {dx: 0, dy: 0, value: 1}

  - id: [3]
    priority: 8
    shifts:
      - group:
          - direction: east
            steps: 2
    changes:
      - {dx: 0, dy: 0, value: 5}
