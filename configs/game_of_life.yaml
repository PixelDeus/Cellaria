#
# Конфиг Game of Life (3×3 паттерн, 512 правил).
#
# Правила:
#   - Живая клетка (1) с 2 или 3 живыми соседями — живёт.
#   - Мёртвая клетка (0) с 3 живыми соседями — рождается.
#   - Всё остальное — умирает.
#
# Каждое правило проверяет все 8 соседей через двумерный паттерн.
# Всего 2^9 = 512 комбинаций.
#
# Для краткости правила генерируются скриптом, но здесь приведены
# ключевые группы: выживание (survive) и рождение (born).
#
grid:
  width: 10
  height: 10
  default_cell_type: 0
  initial_cells:
    - coord: [4, 4]
      type: 1
    - coord: [5, 4]
      type: 1
    - coord: [6, 4]
      type: 1   # блинкер (период 2)

rules:
  # --- Выживание: центр=1, соседи=2 или 3 ---

  # 2 соседа (жива)
  - id: []
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, -1], type: 1 }
      - { offset: [0, -1], type: 1 }
      - { offset: [1, -1], type: 0 }
      - { offset: [-1, 0], type: 0 }
      - { offset: [1, 0], type: 0 }
      - { offset: [-1, 1], type: 0 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 1]

  # 2 соседа (вариант 2)
  - id: []
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, -1], type: 0 }
      - { offset: [0, -1], type: 0 }
      - { offset: [1, -1], type: 1 }
      - { offset: [-1, 0], type: 0 }
      - { offset: [1, 0], type: 0 }
      - { offset: [-1, 1], type: 1 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 1]

  # 3 соседа
  - id: []
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, -1], type: 1 }
      - { offset: [0, -1], type: 1 }
      - { offset: [1, -1], type: 1 }
      - { offset: [-1, 0], type: 0 }
      - { offset: [1, 0], type: 0 }
      - { offset: [-1, 1], type: 0 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 1]

  # --- Рождение: центр=0, соседи=3 ---

  - id: []
    priority: 10
    pattern:
      - { offset: [0, 0], type: 0 }
      - { offset: [-1, -1], type: 1 }
      - { offset: [0, -1], type: 1 }
      - { offset: [1, -1], type: 1 }
      - { offset: [-1, 0], type: 0 }
      - { offset: [1, 0], type: 0 }
      - { offset: [-1, 1], type: 0 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 1]

  - id: []
    priority: 10
    pattern:
      - { offset: [0, 0], type: 0 }
      - { offset: [-1, -1], type: 0 }
      - { offset: [0, -1], type: 1 }
      - { offset: [1, -1], type: 0 }
      - { offset: [-1, 0], type: 1 }
      - { offset: [1, 0], type: 1 }
      - { offset: [-1, 1], type: 0 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 1]

  # --- Смерть (все остальные комбинации) ---
  # Если центр=1, а соседей !=2 и !=3 — умирает
  - id: []
    priority: 5
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, -1], type: 0 }
      - { offset: [0, -1], type: 0 }
      - { offset: [1, -1], type: 0 }
      - { offset: [-1, 0], type: 0 }
      - { offset: [1, 0], type: 0 }
      - { offset: [-1, 1], type: 0 }
      - { offset: [0, 1], type: 0 }
      - { offset: [1, 1], type: 0 }
    changes:
      - [0, 0, 0]