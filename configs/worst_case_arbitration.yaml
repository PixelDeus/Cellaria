# =============================================================================
# Худший случай для CA-арбитража: Ω(M²) попарных проверок
#
# Конструкция:
#   M правил с одинаковым id=[1, 0], одинаковым priority=10, min_age=0.
#   Все правила совпадают на одной ячейке типа 1.
#   Affected regions всех правил пересекаются (центр + вторая ячейка паттерна).
#   Арбитраж принимает только одно правило, отклоняет остальные M-1.
#
# Количество проверок used_cells.contains:
#   Первое правило: 0 проверок (used_cells пуст)
#   Второе правило: 1 проверка (против первого)
#   Третье правило: 2 проверки (против первого и второго)
#   ...
#   M-е правило: M-1 проверок
#   Сумма: 0 + 1 + 2 + ... + (M-1) = M(M-1)/2
#
# Для M=5: 10 проверок, M=10: 45, M=20: 190.
#
# Теорема: Ω(M²) — нижняя граница для любого алгоритма арбитража
# на M попарно конфликтующих правилах с общим центром.
# =============================================================================

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [1, 0]
      type: 1

  boundaries: []

rules:
  # M=5 правил с одинаковым id=[1, 0] и priority=10
  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 10}

  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 20}

  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 30}

  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 40}

  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 50}