# =============================================================================
# Волна распространения вправо от центра
#
# Правило: [1, 0] → обе клетки становятся 1.
# Волна распространяется вправо: каждый тик граница смещается на +1.
#
# Решётка 32×1. Начало: 1 в центре (позиция 16).
# Результат: 0...0 1 1 1 1...1 (правая половина заполнена).
# =============================================================================

grid:
  width: 32
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [16, 0]
      type: 1        # начальный маркер волны

  boundaries: []

rules:
  # [1, 0] → пишет 1 на обеих клетках, остаётся на месте
  - id: [1, 0]
    priority: 10
    changes:
      - {dx: 0, dy: 0, value: 1}    # центр → 1
      - {dx: 1, dy: 0, value: 1}    # правый сосед → 1
