# Wireworld — разветвление (T-образный путь)
# Электрон входит слева, выходит справа И снизу.
# Головка=2, хвост=3, проводник=1, пусто=0

grid:
  width: 12
  height: 12
  default_cell_type: 0
  initial_cells:
    # T-образный путь: вход слева, раздвоение вправо и вниз
    - coord: [1, 5]
      type: 2   # головка электрона на входе
    - coord: [2, 5]
      type: 1
    - coord: [3, 5]
      type: 1
    - coord: [4, 5]
      type: 1
    - coord: [5, 5]
      type: 1   # точка разветвления
    # Ветка вправо
    - coord: [6, 5]
      type: 1
    - coord: [7, 5]
      type: 1
    - coord: [8, 5]
      type: 1
    # Ветка вниз
    - coord: [5, 6]
      type: 1
    - coord: [5, 7]
      type: 1
    - coord: [5, 8]
      type: 1

rules:
  # Головка (2) → хвост (3)
  - id: [2]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 3}

  # Хвост (3) → проводник (1)
  - id: [3]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 3 }
    changes:
      - {dx: 0, dy: 0, value: 1}

  # Проводник (1) с головкой слева → головка (2)
  - id: [50]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой справа → головка (2)
  - id: [51]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [1, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой сверху → головка (2)
  - id: [52]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [0, -1], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой снизу → головка (2)
  - id: [53]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [0, 1], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}