# IO-границы: вход (канал 0) и выход (канал 1).
#
# Демонстрирует работу с граничными буферами.
# Правило [5] активируется, когда на ячейке (0,0) появляется тип 5,
# затем сдвигается на восток.

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells: []

  boundaries:
    - cell: [0, 0]
      channel: 0
      direction: input
      max_queue: 16
    - cell: [7, 0]
      channel: 1
      direction: output
      max_queue: 16

rules:
  - id: [5]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 5}
