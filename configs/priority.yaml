# Приоритет правил: два правила на один и тот же паттерн [1, 2].
#
# Правило 1: priority=10, изменения: [0,0,5], [1,0,5].
# Правило 2: priority=5, изменения: [0,0,6], [1,0,6].
# Победит правило 1 (высший приоритет).

grid:
  width: 4
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 1
    - coord: [1, 0]
      type: 2

  boundaries: []

rules:
  - id: [1, 2]
    priority: 10
    changes:
      - [0, 0, 5]
      - [1, 0, 5]

  - id: [1, 2]
    priority: 5
    changes:
      - [0, 0, 6]
      - [1, 0, 6]