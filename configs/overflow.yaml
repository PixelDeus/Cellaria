# Демонстрация overflow при cдвиге длиннее количества ячеек в group.
#
# Правило 1 (id: [1, 2], priority=10): сдвиг на восток на 2 шага.
#   group_cells: (2,0), (3,0) → changes: [0,0,0], [1,0,1]
#   сдвиг на 2: (2,0) ← 0, (3,0) ← old(2,0)=1, (4,0) ← old(3,0)=2
#   Затирание (4,0) типом 0.
#
# Правило 2 (id: [3, 4], priority=10): сдвиг на восток на 2 шага.
#   group_cells: (2,1), (3,1) → changes: [0,0,0], [1,0,3]
#   сдвиг на 2: (2,1) ← 0, (3,1) ← old(2,1)=3, (4,1) ← old(3,1)=4
#   Затирание (4,1) типом 0.

grid:
  width: 8
  height: 2
  default_cell_type: 0

  initial_cells:
    - coord: [2, 0]
      type: 1
    - coord: [3, 0]
      type: 2
    - coord: [2, 1]
      type: 3
    - coord: [3, 1]
      type: 4

  boundaries: []

rules:
  # сдвиг на 2 → вытекает на (4, 0) и затирается default_cell_type=0
  - id: [1, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 2
    changes:
      - {dx: 0, dy: 0, value: 0}
      - {dx: 1, dy: 0, value: 1}

  # сдвиг на 2 → вытекает на (4, 1) и затирается default_cell_type=0
  - id: [3, 4]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 2
    changes:
      - {dx: 0, dy: 0, value: 0}
      - {dx: 1, dy: 0, value: 3}
