# =============================================================================
# Композиция двух conflict-free наборов правил
#
# Демонстрация: объединение двух conflict-free наборов остаётся conflict-free.
#
# R₁: «Челнок» — правила [10] и [1] чередуются, двигаясь вправо.
#   - [10] → shift east(1), change → [0,0,1]
#   - [1]  → shift east(1), change → [0,0,10]
#   R₁ conflict-free: [10] и [1] имеют разные head-типы, не конкурируют.
#
# R₂: «Уборщик» — правило [99] с min_age: 3, двигается вправо за челноком.
#   - [99] → min_age: 3, shift east(1), change → [0,0,99]
#   R₂ conflict-free (одно правило).
#
# R₁ ∪ R₂ conflict-free: head-типы 10, 1, 99 — все различны.
# Конфликт-граф пуст, арбитраж не нужен.
# =============================================================================

grid:
  width: 10
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10      # челнок — старт
    - coord: [5, 0]
      type: 99      # уборщик — ждёт 3 тика, затем следует за челноком

  boundaries: []

rules:
  # ==========================================================================
  # R₁: Челнок — чередует типы 10→1→10→1, двигаясь вправо
  # ==========================================================================

  # Правило: [10] → сдвиг вправо, становится 1
  - id: [10]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 1}

  # Правило: [1] → сдвиг вправо, становится 10
  - id: [1]
    priority: 10
    min_age: 0
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 10}

  # ==========================================================================
  # R₂: Уборщик — следует за челноком с задержкой 3 тика
  # ==========================================================================

  # Правило: [99] → min_age: 3, сдвиг вправо, остаётся 99
  - id: [99]
    priority: 5
    min_age: 3
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 99}
