# Контрпример: недетерминизм при равных приоритетах.
#
# Два правила с одинаковым id [1, 2], одинаковым priority=10,
# но разными эффектами.
#
# Первое правило: east 1, меняет [1, 2] → [5, 5]
# Второе правило: west 1, меняет [1, 2] → [6, 6]
#
# При каждом запуске возможны разные результаты:
# - Если первое правило срабатывает первым: [1, 2] → [5, 5]
# - Если второе правило срабатывает первым: [1, 2] → [6, 6]
#
# Это демонстрирует, что CF ≡ CA неверна:
# любая CF-программа детерминирована (нет выбора),
# а CA-программа с конфликтами может быть недетерминирована.
#
# Примечание: для min_age = 0 проблема не исчезает,
# так как причина — не детерминизм, а одинаковый priority.
# Даже если min_age = 0, порядок применения правил
# с одинаковым priority не определён.

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [1, 0]
      type: 1
    - coord: [2, 0]
      type: 2

  boundaries: []

rules:
  - id: [1, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 5}
      - {dx: 1, dy: 0, value: 5}

  - id: [1, 2]
    priority: 10
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 6}
      - {dx: -1, dy: 0, value: 6}
