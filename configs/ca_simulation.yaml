# =============================================================================
# Одномерный клеточный автомат (XOR: f(center, right) = center XOR right)
#
# Маркер (тип 10) идёт вдоль строки слева направо.
# Для каждой тройки [10, center, right] вычисляет center XOR right
# и записывает результат в ячейку, откуда пришёл (позади маркера).
#
# Один проход маркера = одна итерация CA.
# Остановка: маркер доходит до правого края и не находит правила.
#
# Начало: одна 1 в середине (позиция 16), маркер на позиции 0.
# =============================================================================

grid:
  width: 32
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10       # вычислительный маркер
    - coord: [16, 0]
      type: 1        # единственная 1 в середине

  boundaries: []

rules:
  # [10, 0, 0] → 0 XOR 0 = 0
  - id: [10, 0, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 0]

  # [10, 0, 1] → 0 XOR 1 = 1
  - id: [10, 0, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 1]

  # [10, 1, 0] → 1 XOR 0 = 1
  - id: [10, 1, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 1]

  # [10, 1, 1] → 1 XOR 1 = 0
  - id: [10, 1, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 0]