# Параллельное применение: два непересекающихся правила на одной строке.
#
# Правило 1 (id: [1, 2]) на (0,0)-(1,0) → [5, 5].
# Правило 2 (id: [3, 4]) на (5,0)-(6,0) → [6, 6].
# Применяются одновременно, не мешая друг другу.

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 1
    - coord: [1, 0]
      type: 2
    - coord: [5, 0]
      type: 3
    - coord: [6, 0]
      type: 4

  boundaries: []

rules:
  - id: [1, 2]
    priority: 10
    changes:
      - [0, 0, 5]
      - [1, 0, 5]

  - id: [3, 4]
    priority: 10
    changes:
      - [0, 0, 6]
      - [1, 0, 6]