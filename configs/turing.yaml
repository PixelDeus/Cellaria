# Машина Тьюринга в Cellarium
# Доказательство тьюринг-полноты модели локальной редукции.
#
# Кодировка:
#   тип 10 = головка в состоянии Q0
#   тип 1  = символ ленты "1"
#   тип 2  = символ ленты "0"
#   тип 0  = пустая ячейка (конец ленты, остановка)
#
# Механика:
#   Головка + символ под ней = цепочка из 2 ячеек [10, X].
#   Правило заменяет символ (0↔1) и сдвигает цепочку на 1 вправо.
#   Позади остаётся fill_value=0.
#   Когда головка доходит до пустой ячейки — нет правила для (10, 0) — остановка.
#
# Начальная лента: 1 0 1 1 0
# Ожидаемый результат: 0 1 0 0 1

grid:
  width: 16
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10
    - coord: [1, 0]
      type: 1
    - coord: [2, 0]
      type: 2
    - coord: [3, 0]
      type: 1
    - coord: [4, 0]
      type: 1
    - coord: [5, 0]
      type: 2

  boundaries: []

rules:
  # (Q0, 0) → (Q0, 1), East
  - id: 1
    priority: 10
    pattern:
      - offset: [0, 0]
        type: 10
      - offset: [1, 0]
        type: 2
    result: [10, 1]
    shift:
      direction: East
      chain_length: 2
      fill_value: 0
      overflow: discard

  # (Q0, 1) → (Q0, 0), East
  - id: 2
    priority: 10
    pattern:
      - offset: [0, 0]
        type: 10
      - offset: [1, 0]
        type: 1
    result: [10, 2]
    shift:
      direction: East
      chain_length: 2
      fill_value: 0
      overflow: discard