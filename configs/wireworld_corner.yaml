# Wireworld — поворот на 90°
# Проводник: L-образный путь. Электрон входит слева, выходит снизу.
# Головка=2, хвост=3, проводник=1, пусто=0

grid:
  width: 10
  height: 10
  default_cell_type: 0
  initial_cells:
    # L-образный путь проводников
    - coord: [1, 1]
      type: 2   # головка электрона на входе
    - coord: [2, 1]
      type: 1
    - coord: [3, 1]
      type: 1
    - coord: [3, 2]
      type: 1
    - coord: [3, 3]
      type: 1
    - coord: [3, 4]
      type: 1
    - coord: [3, 5]
      type: 1

rules:
  # Головка (2) → хвост (3)
  - id: [2]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 3}

  # Хвост (3) → проводник (1)
  - id: [3]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 3 }
    changes:
      - {dx: 0, dy: 0, value: 1}

  # Проводник (1) с головкой слева → головка (2)
  - id: [40]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [-1, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой справа → головка (2)
  - id: [41]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [1, 0], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой сверху → головка (2)
  - id: [42]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [0, -1], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}

  # Проводник (1) с головкой снизу → головка (2)
  - id: [43]
    priority: 10
    pattern:
      - { offset: [0, 0], type: 1 }
      - { offset: [0, 1], type: 2 }
    changes:
      - {dx: 0, dy: 0, value: 2}