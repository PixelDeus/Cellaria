# Конфликт правил на одной позиции: две пары типов с разными приоритетами.
#
# Группа [1, 2] (priority=10) и группа [3, 4] (priority=5) не пересекаются,
# потому что паттерны находятся на разных координатах.
# Если бы пересекались — победило бы правило с более высоким приоритетом.

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [1, 0]
      type: 1
    - coord: [2, 0]
      type: 2
    - coord: [5, 0]
      type: 3
    - coord: [6, 0]
      type: 4

  boundaries: []

rules:
  - id: [1, 2]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 5}
      - {dx: 1, dy: 0, value: 5}

  - id: [3, 4]
    priority: 5
    shifts:
      - group:
          - direction: west
            steps: 1
    changes:
      - {dx: 0, dy: 0, value: 6}
      - {dx: -1, dy: 0, value: 6}
