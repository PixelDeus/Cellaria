# Две головки на ленте, встречное движение, столкновение.
#
# Головка A (тип 1) движется на восток.
# Головка B (тип 3) движется на запад.
# При столкновении: [1, 3] → [7, 7] (приоритет 20 > 10).
#
# Heads at 0 and 3 → через 1 шаг [1, 3] на x=1 → 7, 7.

grid:
  width: 8
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 1
    - coord: [3, 0]
      type: 3

  boundaries: []

rules:
  # ── Головка A: движение на восток (паттерн [1, 0]) ────────
  - id: [1, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes: []

  # ── Головка B: движение на запад (паттерн [3, 0]) ─────────
  - id: [3, 0]
    priority: 10
    shifts:
      - group:
          - direction: west
            steps: 1
    changes: []

  # ── Столкновение: [1, 3] → [7, 7] (приоритет выше) ────────
  - id: [1, 3]
    priority: 20
    changes:
      - {dx: 0, dy: 0, value: 7}
      - {dx: 1, dy: 0, value: 7}
