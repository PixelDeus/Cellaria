# =============================================================================
# Две TM-головки на одной ленте (непересекающиеся регионы)
#
# Головка A (тип 10) — левая половина ленты (позиции 0-7).
# Головка B (тип 20) — правая половина ленты (позиции 8-15).
# Обе инвертируют биты и движутся на восток.
#
# Conflict-free: разные head-типы (10, 20), affected regions не пересекаются.
#
# Начало: 10 1 0 1 1 0 0 0 20 1 0 1 0 0 0 0
# =============================================================================

grid:
  width: 16
  height: 1
  default_cell_type: 0

  initial_cells:
    - coord: [0, 0]
      type: 10       # головка A
    - coord: [1, 0]
      type: 1
    - coord: [2, 0]
      type: 0
    - coord: [3, 0]
      type: 1
    - coord: [4, 0]
      type: 1
    - coord: [5, 0]
      type: 0
    - coord: [6, 0]
      type: 0
    - coord: [7, 0]
      type: 0
    - coord: [8, 0]
      type: 20      # головка B
    - coord: [9, 0]
      type: 1
    - coord: [10, 0]
      type: 0
    - coord: [11, 0]
      type: 1
    - coord: [12, 0]
      type: 0
    - coord: [13, 0]
      type: 0
    - coord: [14, 0]
      type: 0
    - coord: [15, 0]
      type: 0

  boundaries: []

rules:
  # ==========================================================================
  # Головка A (тип 10): инвертирует бит, сдвиг на восток
  # ==========================================================================

  # [10, 1] → головка A над 1 → инвертирует в 0, сдвиг вправо
  - id: [10, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 0]

  # [10, 0] → головка A над 0 → инвертирует в 1, сдвиг вправо
  - id: [10, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 1]

  # ==========================================================================
  # Головка B (тип 20): инвертирует бит, сдвиг на восток
  # ==========================================================================

  # [20, 1] → головка B над 1 → инвертирует в 0, сдвиг вправо
  - id: [20, 1]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 0]

  # [20, 0] → головка B над 0 → инвертирует в 1, сдвиг вправо
  - id: [20, 0]
    priority: 10
    shifts:
      - group:
          - direction: east
            steps: 1
    changes:
      - [-1, 0, 1]